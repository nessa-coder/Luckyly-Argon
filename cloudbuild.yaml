steps:
# Step 1: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - 'gcloud'
  - 'run'
  - 'deploy'
  - 'luckyly-1'
  - '--source'
  - '.'
  - '--region'
  - 'asia-southeast1'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'SQL_DB_NAME=cloud_sql_production_database'
  - '--update-secrets'
  - 'GEMINI_API_KEY=GEMINI_API_KEY_SECRET:latest'

images:
- 'gcr.io/$PROJECT_ID/luckyly-1'

# ADD THIS SECTION BELOW TO FIX THE LOGGING ERROR
options:
  logging: CLOUD_LOGGING_ONLY
