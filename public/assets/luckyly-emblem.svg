<svg viewBox="0 0 110 110" width="110" height="110" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Facet Gradients (Refined 24k Luxury Palette) -->
    <linearGradient id="emblemGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <linearGradient id="emblemGoldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#552c08"/>
    </linearGradient>

    <linearGradient id="emblemGoldBase" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="40%" stop-color="#fef9c3"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="emblemGoldArm" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <linearGradient id="emblemGoldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Ruby Star Gradients -->
    <radialGradient id="emblemRubyCore" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <filter id="emblemRubyGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Mathematically Centered Group: translation (-11, 7) centers width 64 at 55 and height 68 at 55 -->
  <g filter="url(#emblemShadow)" transform="translate(-11, 7)">
    <!-- 4-Pointed Ruby Star Sparkle -->
    <g filter="url(#emblemRubyGlow)">
      <path d="M 68,14 Q 68,28 82,28 Q 68,28 68,42 Q 68,28 54,28 Q 68,28 68,14 Z" 
            fill="url(#emblemRubyCore)" 
            stroke="#fca5a5" 
            stroke-width="0.8" 
            stroke-opacity="0.85"/>
      <path d="M 68,19 Q 68,28 77,28 Q 68,28 68,37 Q 68,28 59,28 Q 68,28 68,19 Z" 
            fill="#f87171" 
            opacity="0.75"/>
      <circle cx="68" cy="28" r="1.6" fill="#ffffff"/>
    </g>

    <!-- Origami Faceted Gold Ribbon Loop -->
    <polygon points="36,44 62,34 58,66 36,44" 
             fill="url(#emblemGoldTop)" 
             stroke="#ffffff" 
             stroke-width="0.5" 
             stroke-opacity="0.45"/>

    <polygon points="36,44 58,66 34,82 36,44" 
             fill="url(#emblemGoldRight)" 
             stroke="#fef08a" 
             stroke-width="0.45" 
             stroke-opacity="0.4"/>

    <polygon points="62,34 63,55 58,66 62,34" 
             fill="url(#emblemGoldHighlight)" 
             stroke="#ffffff" 
             stroke-width="0.5" 
             stroke-opacity="0.55"/>

    <polygon points="34,82 72,82 59,67 34,82" 
             fill="url(#emblemGoldBase)" 
             stroke="#ffffff" 
             stroke-width="0.5" 
             stroke-opacity="0.4"/>

    <polygon points="59,67 72,82 86,67 59,67" 
             fill="url(#emblemGoldArm)" 
             stroke="#fef08a" 
             stroke-width="0.45" 
             stroke-opacity="0.45"/>

    <polygon points="72,82 86,67 98,67 72,82" 
             fill="url(#emblemGoldHighlight)" 
             stroke="#ffffff" 
             stroke-width="0.5" 
             stroke-opacity="0.55"/>
  </g>
</svg>
